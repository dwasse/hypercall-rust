[package]
name = "hypercall-ws-protocol"
version = "0.1.0"
edition = "2021"
description = "Stable WebSocket protocol DTOs for Hypercall edge services"
readme = "README.md"
license = "MIT"
homepage = "https://github.com/hypercall-public"
documentation = "https://docs.rs/hypercall-ws-protocol"
keywords = ["hypercall", "websocket", "trading", "sdk"]
categories = ["api-bindings", "web-programming::websocket"]
include = ["Cargo.toml", "README.md", "src/**"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
serde_json = "1.0"
